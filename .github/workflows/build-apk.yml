yaml
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTA: nel progetto mancano gli script gradlew/gradlew.bat (wrapper).
      # Installiamo Gradle direttamente con questa action ufficiale, leggendo
      # la versione da gradle/wrapper/gradle-wrapper.properties.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TLCField-debug-apk
          path: app/build/outputs/apk/debug/*.apk
